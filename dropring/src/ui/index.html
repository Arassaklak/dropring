<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>DropRing</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" fill="var(--accent)"/><g stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="16" cy="16" r="2.8" fill="#fff"/><path d="M16 13.2C14.2 8 17.8 4.6 21 6.8M18.8 16c5.2-1.8 8.6 1.8 6.4 5M16 18.8c1.8 5.2-1.8 8.6-5 6.4M13.2 16C8 17.8 4.6 14.2 6.8 11"/></g></svg>
    DropRing
  </div>
  <a data-p="home" class="on"><span class="i">⌂</span><span data-i18n="home"></span></a>
  <a data-p="recipes"><span class="i">✦</span><span data-i18n="recipes"></span></a>
  <a data-p="watch"><span class="i">◉</span><span data-i18n="watch"></span></a>
  <a data-p="settings"><span class="i">⚙</span><span data-i18n="settings"></span></a>
  <a data-p="about"><span class="i">ⓘ</span><span data-i18n="about"></span></a>
  <div class="grow"></div>
  <div class="ver" id="ver"></div>
</nav>

<main>
  <!-- Ana sayfa -->
  <section class="page on" id="p-home">
    <div id="access"></div>
    <div class="drop" id="drop">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="20" opacity=".25"/><circle cx="24" cy="24" r="9"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6"/></svg>
      <div class="big" data-i18n="dropTitle"></div>
      <div class="small" data-i18n="dropSub"></div>
    </div>
    <div class="quick">
      <span class="chip" id="clip">📋 <span data-i18n="clipShortcut"></span></span>
    </div>
    <div class="how" id="how"></div>
    <h2><span data-i18n="recent"></span> <button class="btn sm" id="clearH" style="float:right" data-i18n="clear"></button></h2>
    <div class="hist" id="jobs"></div>
    <div class="hist" id="hist"></div>
  </section>

  <!-- Tarifler -->
  <section class="page" id="p-recipes">
    <h1 data-i18n="recipes"></h1>
    <p class="lead" id="recipesLead"></p>
    <div class="split">
      <div>
        <div class="rlist" id="rlist"></div>
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
          <button class="btn sm" id="rNew" data-i18n="newRecipe"></button>
          <button class="btn sm" id="rReset" data-i18n="resetRecipes"></button>
        </div>
      </div>
      <div class="card" id="redit" style="padding:16px 18px"></div>
    </div>
  </section>

  <!-- İzlenen klasörler -->
  <section class="page" id="p-watch">
    <h1 data-i18n="watch"></h1>
    <p class="lead" id="watchLead"></p>
    <div id="wlist"></div>
    <button class="btn pri" id="wAdd" data-i18n="newWatch"></button>
  </section>

  <!-- Ayarlar -->
  <section class="page" id="p-settings">
    <h1 data-i18n="settings"></h1>
    <div id="settingsForm"></div>
  </section>

  <!-- Hakkında -->
  <section class="page" id="p-about">
    <h1>DropRing</h1>
    <p class="lead" data-i18n="aboutText"></p>
    <div class="card" style="padding:14px 18px">
      <p data-i18n="inspired"></p>
      <p class="muted" id="engines"></p>
      <p class="muted">MIT · sharp/libvips · FFmpeg · pdf.js · pdf-lib · mammoth · SheetJS · Electron</p>
    </div>
  </section>
</main>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
