<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:">
<title>pdf worker</title>
<script type="module">
  // PDF → görsel çizici (pdf.js). Ana süreç executeJavaScript ile çağırır.
  import * as pdfjs from '../../node_modules/pdfjs-dist/build/pdf.mjs';
  pdfjs.GlobalWorkerOptions.workerSrc = '../../node_modules/pdfjs-dist/build/pdf.worker.mjs';
  let doc = null;
  window.openPdf = async (b64) => {
    const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    doc = await pdfjs.getDocument({ data: bin, isEvalSupported: false, cMapUrl: '../../node_modules/pdfjs-dist/cmaps/', cMapPacked: true, standardFontDataUrl: '../../node_modules/pdfjs-dist/standard_fonts/' }).promise;
    return doc.numPages;
  };
  window.renderPage = async (n, dpi, format, quality) => {
    const page = await doc.getPage(n);
    const vp = page.getViewport({ scale: dpi / 72 });
    const c = document.createElement('canvas');
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    page.cleanup();
    const mime = { jpg: 'image/jpeg', webp: 'image/webp' }[format] || 'image/png';
    return c.toDataURL(mime, quality);
  };
  window.closePdf = async () => { if (doc) await doc.destroy(); doc = null; return true; };
  window.__ready = true;
</script>
