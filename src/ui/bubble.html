<!doctype html>
<html>
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>DropRing balon</title>
<style>
  :root { --accent: #6c5ce7; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #b { position: absolute; left: 10px; top: 10px; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8f83ff, var(--accent)); box-shadow: 0 6px 18px rgba(0,0,0,.3); display: grid; place-items: center; cursor: grab; transition: transform .15s; }

  svg { width: 34px; height: 34px; pointer-events: none; }
</style>
</head>
